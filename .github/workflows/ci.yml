# Actions are pinned by commit SHA and tools by version + checksum, all to releases
# at least 2 weeks old when pinned (supply-chain cooling-off). Bump via pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs the whole suite before building a tag

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local # use exactly the toolchain setup-go installed from go.mod
  GOFLAGS: -mod=readonly

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Toolchain matches go.mod
        run: |
          want="go$(awk '/^go /{print $2}' backend/go.mod)"
          go version | grep -q " ${want} " || { echo "want ${want}, got $(go version)"; exit 1; }
      - name: gofmt
        run: test -z "$(gofmt -l backend)" || { gofmt -l backend; exit 1; }
      - run: go -C backend vet ./...
      - run: go -C backend vet -tags integration ./...
      - run: go -C backend tool staticcheck ./...

  vulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go -C backend tool govulncheck ./...

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go -C backend test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage ≥ 80%
        run: |
          go -C backend tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
          go -C backend tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); if ($3 + 0 < 80) { print "coverage below 80%"; exit 1 } }'

  # Every fuzz target of the hostile-input parsers for 30s each (scripts/fuzz.sh).
  # A crasher is written to the package's testdata/fuzz/; commit it with the fix
  # so it replays as a regular test.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Fuzz (30s per target)
        env:
          FUZZTIME: 30s
        run: ./scripts/fuzz.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers
          path: backend/**/testdata/fuzz/
          retention-days: 30

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Postgres (testcontainers) — RLS, grants, River
        run: go -C backend test -tags integration -count=1 ./...

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci # .npmrc: ignore-scripts=true
        working-directory: frontend
      - name: API types match the backend's OpenAPI document
        working-directory: frontend
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint && npm run build
        working-directory: frontend

  image:
    runs-on: ubuntu-24.04
    env:
      GVISOR_RELEASE: "20261005.0"
      GVISOR_SHA512: 79869ae9a589355a46d46fdac068d9a954e741741ffe77c64e38c56ea955498c1cb04e9bce44e1cce5155333e6b76bee72347c6661bb7c78fd2fe3aad198c8fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build image (web UI, api/worker/migrate, docker CLI)
        run: docker build -f backend/Dockerfile -t warden/api:ci .
      - name: Image runs as non-root and the healthcheck binary works
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' warden/api:ci)" = "65532:65532"
          docker run --rm --entrypoint /usr/local/bin/warden-migrate warden/api:ci && exit 1 || test $? -eq 2
      - name: Smoke test (UI and its CSP, web-config, migrations, docker CLI)
        run: ./scripts/image-smoke.sh warden/api:ci
      - name: Install gVisor (runsc), as in the selfscan job
        run: |
          curl -fsSL -o /tmp/gvisor.tar.bz2 \
            "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  /tmp/gvisor.tar.bz2" | sha512sum -c -
          sudo tar -xjf /tmp/gvisor.tar.bz2 -C /usr/local/bin runsc containerd-shim-runsc-v1
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info -f '{{json .Runtimes}}' | grep -q '"runsc"'
      - name: Production compose (app.env=prod, Caddy with an internal CA, worker on runsc)
        env:
          SMOKE_SCANNER: "1"
          SMOKE_SCRATCH: /srv/warden/scratch
          SMOKE_MIRROR: /srv/warden/mirror
        run: |
          sudo install -d -o 65532 -g 65532 -m 700 "$SMOKE_SCRATCH"
          sudo install -d -o 65532 -g 65532 -m 755 "$SMOKE_MIRROR"
          ./scripts/compose-smoke.sh warden/api:ci

  # The Helm chart (deploy/helm): lint, renders that must pass or be refused,
  # kubeconform, and the security properties of every render.
  helm:
    runs-on: ubuntu-24.04
    env:
      HELM_VERSION: v3.22.1
      HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      YQ_VERSION: v4.54.1
      YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install helm, kubeconform, yq (pinned, checksummed)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          curl -fsSL -o helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz --strip-components=1 -C "$bin" linux-amd64/helm
          curl -fsSL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz -C "$bin" kubeconform
          curl -fsSL -o "$bin/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $bin/yq" | sha256sum -c -
          chmod 0755 "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Chart checks
        run: ./deploy/helm/test/run.sh

  # Warden scans itself with the production sandbox (gVisor). Any Critical or
  # un-baselined High blocks every run, so a finding surfaces on its pull request
  # instead of at release time (v0.1.0-alpha.1 was stopped at the tag by one).
  selfscan:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    env:
      GVISOR_RELEASE: "20261005.0"
      GVISOR_SHA512: 79869ae9a589355a46d46fdac068d9a954e741741ffe77c64e38c56ea955498c1cb04e9bce44e1cce5155333e6b76bee72347c6661bb7c78fd2fe3aad198c8fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install gVisor (runsc)
        run: |
          curl -fsSL -o /tmp/gvisor.tar.bz2 \
            "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  /tmp/gvisor.tar.bz2" | sha512sum -c -
          sudo tar -xjf /tmp/gvisor.tar.bz2 -C /usr/local/bin runsc containerd-shim-runsc-v1
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info -f '{{json .Runtimes}}' | grep -q '"runsc"'
      - name: Offline mirror (Trivy DB, pinned Opengrep rules)
        run: ./scripts/sync-mirror.sh
      - name: Self-scan
        run: |
          go -C backend run ./cmd/selfscan -root "$GITHUB_WORKSPACE" -runtime runsc -fail-on high
      - name: Kernel OOM log (on failure)
        if: failure()
        run: sudo dmesg -T | grep -iE 'out of memory|oom|killed process' | tail -20 || echo "no OOM entries"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selfscan-reports
          path: reports/selfscan/
          retention-days: 90

  # The kubernetes sandbox backend against a real cluster: kind with gVisor
  # (runsc) in the node, NetworkPolicy enforced (kube-network-policies), the
  # worker's namespaced Role only (scripts/kind-gvisor.sh). Each scanner runs
  # through kube.Backend and through the docker backend on runsc; the
  # findings must match and no SARIF may hold the raw secret. The canary must
  # find the sandbox namespace isolated and one without a policy not.
  kube:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    timeout-minutes: 60
    env:
      GVISOR_RELEASE: "20261005.0"
      GVISOR_SHA512: 79869ae9a589355a46d46fdac068d9a954e741741ffe77c64e38c56ea955498c1cb04e9bce44e1cce5155333e6b76bee72347c6661bb7c78fd2fe3aad198c8fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install gVisor (runsc) for the docker backend, as in the selfscan job
        run: |
          curl -fsSL -o /tmp/gvisor.tar.bz2 \
            "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  /tmp/gvisor.tar.bz2" | sha512sum -c -
          sudo tar -xjf /tmp/gvisor.tar.bz2 -C /usr/local/bin runsc containerd-shim-runsc-v1
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info -f '{{json .Runtimes}}' | grep -q '"runsc"'
      - name: Offline mirror (Trivy DB, pinned Opengrep rules)
        run: ./scripts/sync-mirror.sh
      - name: kind cluster with gVisor, registry and images
        run: ./scripts/kind-gvisor.sh
      - run: go -C backend vet -tags kube ./internal/scan/sandbox/kube/
      - name: Kubernetes backend vs docker backend, canary
        env:
          WARDEN_KUBE_TEST_DOCKER_RUNTIME: runsc
        run: |
          set -a; . .cache/kind/env; set +a
          go -C backend test -tags kube -count=1 -timeout 45m -v -run '^TestKube' ./internal/scan/sandbox/kube/
      - name: Cluster state (on failure)
        if: failure()
        run: |
          export KUBECONFIG=.cache/kind/kubeconfig
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          kubectl -n kube-system logs ds/kube-network-policies --tail=50 || true
