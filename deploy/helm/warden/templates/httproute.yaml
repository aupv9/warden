{{- if .Values.gateway.enabled }}
# Gateway API route to the API's HTTP port only. TLS terminates at the parent
# Gateway's listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "warden.fullname" . }}
  labels:
    {{- include "warden.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames: [{{ required "domain is required" .Values.domain | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "warden.fullname" . }}-api
          port: {{ .Values.api.service.port }}
{{- end }}
