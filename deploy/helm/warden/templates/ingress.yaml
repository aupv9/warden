{{- if .Values.ingress.enabled }}
{{- $tls := .Values.ingress.tls }}
{{- $secret := default (printf "%s-tls" (include "warden.fullname" .)) $tls.secretName }}
# Routes only the API's HTTP port; /metrics is on the admin port, which no
# Ingress reaches.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "warden.fullname" . }}
  labels:
    {{- include "warden.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  annotations:
    {{- with $tls.certManager.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with $tls.certManager.issuer }}
    cert-manager.io/issuer: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.domain | quote }}]
      secretName: {{ $secret }}
  rules:
    - host: {{ required "domain is required" .Values.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "warden.fullname" . }}-api
                port:
                  name: http
{{- end }}
