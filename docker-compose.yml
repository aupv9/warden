name: warden

services:
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_DB: warden
      POSTGRES_USER: warden_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?run make env}
      WARDEN_APP_PASSWORD: ${WARDEN_APP_PASSWORD:?run make env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warden_owner", "-d", "warden"]
      interval: 5s

  redis:
    image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run make env}"]
    ports: ["127.0.0.1:6379:6379"]

  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # Browsers upload straight to S3 with presigned PUTs; only the dev web UI may
    # (SeaweedFS defaults to allowing every origin). Bucket: scripts/dev-s3-init.sh.
    command: ["server", "-s3", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json", "-s3.allowedOrigins=http://localhost:5173"]
    volumes:
      - s3data:/data
      - ./.cache/dev/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["127.0.0.1:8333:8333"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run make env}
    volumes:
      - ./deploy/keycloak/warden-realm.json:/opt/keycloak/data/import/warden-realm.json:ro
    ports: ["127.0.0.1:8180:8080"]

  mailpit:
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  pgdata:
  s3data:
